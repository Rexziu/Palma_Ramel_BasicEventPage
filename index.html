<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Event-Driven Webpage</title>

    <!--Link to external stylesheet for page styling-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Main container holding all interactive event-->
    <main id="pageContainer">
        <!--Main title heading that updates when greeting-->
        <h1 id="mainHeading">Basic Event Page</h1>
    
        <input type="text" id="nameInput" placeholder="Enter your name"><br>
        <button id="greetingButton"> Display Greeting </button>
        <button id="backgroundButton"> Change Background </button>
        <button id="resetButton"> Reset </button>

        <!--Status message area providing user action feedback.-->
        <p id="messageArea">Enter your name and select an action.</p>


    </main>
    <!--Link to external JavaScript file executed with defer attribute-->
    <script src="script.js" defer></script>
    <p>Name: Palma, Ramel | Course: BSIT | Section: 31-ITE-06 | Date: 2026-08-19</p>
</body>
</html>
